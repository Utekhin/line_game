<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Game Records</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #1a1a2e;
            min-height: 100vh;
            color: #fff;
            padding: 30px;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
        }
        h1 {
            margin-bottom: 30px;
            color: #4CAF50;
        }

        /* Login Form */
        .login-form {
            background: rgba(255,255,255,0.1);
            padding: 30px;
            border-radius: 15px;
            max-width: 400px;
            margin: 50px auto;
        }
        .login-form h2 {
            margin-bottom: 20px;
            text-align: center;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #aaa;
        }
        .form-group input {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background: rgba(255,255,255,0.1);
            color: #fff;
            font-size: 1rem;
        }
        .btn {
            background: #4CAF50;
            color: white;
            border: none;
            padding: 12px 25px;
            font-size: 1rem;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
        }
        .btn:hover { background: #388E3C; }
        .btn:disabled { background: #666; cursor: not-allowed; }
        .btn.secondary { background: #2196F3; }
        .btn.secondary:hover { background: #1976D2; }

        /* Dashboard */
        .dashboard {
            display: none;
        }
        .dashboard.active {
            display: block;
        }

        /* Stats Cards */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .stat-card {
            background: rgba(255,255,255,0.1);
            padding: 20px;
            border-radius: 10px;
            text-align: center;
        }
        .stat-card .value {
            font-size: 2rem;
            font-weight: bold;
            color: #4CAF50;
        }
        .stat-card .label {
            color: #888;
            margin-top: 5px;
        }

        /* Actions */
        .actions {
            display: flex;
            gap: 15px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        /* Games Table */
        .games-section {
            background: rgba(255,255,255,0.05);
            border-radius: 15px;
            padding: 20px;
        }
        .games-section h3 {
            margin-bottom: 15px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        th {
            color: #888;
            font-weight: normal;
        }
        tr:hover {
            background: rgba(255,255,255,0.05);
        }
        .winner-x { color: #2196F3; }
        .winner-o { color: #4CAF50; }
        .winner-none { color: #888; }

        /* Error/Success Messages */
        .message {
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
        }
        .message.error {
            background: rgba(244,67,54,0.3);
            display: block;
        }
        .message.success {
            background: rgba(76,175,80,0.3);
            display: block;
        }

        .refresh-btn {
            background: #FF9800;
        }
        .refresh-btn:hover { background: #F57C00; }
    </style>
</head>
<body>
    <div class="container">
        <!-- Login Form -->
        <div class="login-form" id="loginForm">
            <h2>🔐 Admin Login</h2>
            <div class="message" id="loginError"></div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="password" placeholder="Enter admin password">
            </div>
            <button class="btn" id="loginBtn">Login</button>
        </div>

        <!-- Dashboard -->
        <div class="dashboard" id="dashboard">
            <h1>📊 Game Records Admin</h1>

            <div class="message" id="dashMessage"></div>

            <!-- Stats -->
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="value" id="statTotal">0</div>
                    <div class="label">Total Games</div>
                </div>
                <div class="stat-card">
                    <div class="value" id="statHvA">0</div>
                    <div class="label">Human vs AI</div>
                </div>
                <div class="stat-card">
                    <div class="value" id="statHvH">0</div>
                    <div class="label">Human vs Human</div>
                </div>
                <div class="stat-card">
                    <div class="value" id="statMoves">0</div>
                    <div class="label">Total Moves</div>
                </div>
                <div class="stat-card">
                    <div class="value" id="statXWins">0</div>
                    <div class="label">X Wins</div>
                </div>
                <div class="stat-card">
                    <div class="value" id="statOWins">0</div>
                    <div class="label">O Wins</div>
                </div>
            </div>

            <!-- Actions -->
            <div class="actions">
                <button class="btn secondary" id="downloadJson">Download JSON</button>
                <button class="btn secondary" id="downloadCsv">Download CSV</button>
                <button class="btn refresh-btn" id="refreshBtn">Refresh Stats</button>
            </div>

            <!-- Recent Games -->
            <div class="games-section">
                <h3>Recent Games</h3>
                <table>
                    <thead>
                        <tr>
                            <th>Game ID</th>
                            <th>Type</th>
                            <th>Moves</th>
                            <th>Winner</th>
                            <th>Date</th>
                        </tr>
                    </thead>
                    <tbody id="gamesTable">
                        <tr><td colspan="5" style="text-align:center;color:#888;">Loading...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
    class AdminPanel {
        constructor() {
            this.password = '';
            this.setupEventListeners();
        }

        setupEventListeners() {
            document.getElementById('loginBtn').addEventListener('click', () => this.login());
            document.getElementById('password').addEventListener('keypress', (e) => {
                if (e.key === 'Enter') this.login();
            });
            document.getElementById('downloadJson').addEventListener('click', () => this.download('json'));
            document.getElementById('downloadCsv').addEventListener('click', () => this.download('csv'));
            document.getElementById('refreshBtn').addEventListener('click', () => this.loadStats());
        }

        async login() {
            this.password = document.getElementById('password').value;

            try {
                const response = await fetch(`/api/admin/stats?password=${encodeURIComponent(this.password)}`);

                if (response.ok) {
                    document.getElementById('loginForm').style.display = 'none';
                    document.getElementById('dashboard').classList.add('active');
                    this.loadStats();
                    this.loadGames();
                } else {
                    this.showError('loginError', 'Invalid password');
                }
            } catch (error) {
                this.showError('loginError', 'Connection error');
            }
        }

        async loadStats() {
            try {
                const response = await fetch(`/api/admin/stats?password=${encodeURIComponent(this.password)}`);
                const stats = await response.json();

                document.getElementById('statTotal').textContent = stats.totalGames || 0;
                document.getElementById('statHvA').textContent = stats.humanVsAI || 0;
                document.getElementById('statHvH').textContent = stats.humanVsHuman || 0;
                document.getElementById('statMoves').textContent = stats.totalMoves || 0;
                document.getElementById('statXWins').textContent = stats.xWins || 0;
                document.getElementById('statOWins').textContent = stats.oWins || 0;
            } catch (error) {
                console.error('Error loading stats:', error);
            }
        }

        async loadGames() {
            try {
                const response = await fetch(`/api/admin/games?password=${encodeURIComponent(this.password)}`);
                const data = await response.json();

                const tbody = document.getElementById('gamesTable');

                if (!data.games || data.games.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;color:#888;">No games recorded yet</td></tr>';
                    return;
                }

                tbody.innerHTML = data.games.slice(-20).reverse().map(game => `
                    <tr>
                        <td>${game.gameId || '-'}</td>
                        <td>${game.gameType || '-'}</td>
                        <td>${game.totalMoves || game.moves?.length || 0}</td>
                        <td class="winner-${(game.winner || 'none').toLowerCase()}">${game.winner || 'None'}</td>
                        <td>${this.formatDate(game.recordedAt || game.endedAt)}</td>
                    </tr>
                `).join('');
            } catch (error) {
                console.error('Error loading games:', error);
            }
        }

        download(format) {
            window.location.href = `/api/admin/download?password=${encodeURIComponent(this.password)}&format=${format}`;
        }

        showError(elementId, message) {
            const el = document.getElementById(elementId);
            el.textContent = message;
            el.classList.add('error');
            setTimeout(() => el.classList.remove('error'), 3000);
        }

        formatDate(dateStr) {
            if (!dateStr) return '-';
            const date = new Date(dateStr);
            return date.toLocaleDateString() + ' ' + date.toLocaleTimeString();
        }
    }

    const admin = new AdminPanel();
    </script>
</body>
</html>
